name: CI/CD Pipeline

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    environment: Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh_myhmm_client
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh_myhmm_client/id_rsa_myhmm_client
          chmod 600 ~/.ssh_myhmm_client/id_rsa_myhmm_client
          ssh -i ~/.ssh_myhmm_client/id_rsa_myhmm_client -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_PUBLIC_IP }} <<EOF
          cd /home/ec2-user/pwa-hmm-frontend
          git reset --hard
          git pull origin main
          npm install --production
          npm run build
          export AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          export SESSION_MAX_AGE=${{ secrets.SESSION_MAX_AGE }}
          export API_URL=${{ secrets.API_URL }}
          export BLOB_READ_WRITE_TOKEN=${{ secrets.BLOB_READ_WRITE_TOKEN }}
          export YOUTUBE_API_SECRET_KEY=${{ secrets.YOUTUBE_API_SECRET_KEY }}
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          pm2 stop myhmm_client
          pm2 delete myhmm_client
          pm2 restart ecosystem.config.js
          EOF